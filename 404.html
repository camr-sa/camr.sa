<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#11100d" />
  <title>Page not found | Camr Studio</title>
  <link rel="icon" type="image/png" href="assets/images/camr-favicon-black.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="assets/images/camr-favicon-white.png" media="(prefers-color-scheme: dark)" />
  <style>
    :root{--ink:#14130f;--paper:#f1eee7;--muted:#777268;--line:rgba(20,19,15,0.18);--studio-font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 24px;background:var(--paper);color:var(--ink);font-family:var(--studio-font);text-align:center;}
    .code{font-size:clamp(72px,16vw,140px);font-weight:600;line-height:1;letter-spacing:-.02em;}
    h1{font-size:20px;font-weight:500;margin:0;}
    p{margin:0;color:var(--muted);font-size:14px;line-height:1.7;max-width:340px;}
    .links{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content;}
    a.button{display:inline-block;padding:12px 26px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:opacity .3s;}
    a.button:hover{opacity:.85;}
    a.lang{color:var(--ink);text-decoration:none;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:2px;}
    .brand{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
    .brand b{color:var(--ink);font-weight:600;}
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you are looking for doesn’t exist or may have moved.</p>
  <div class="links">
    <a class="button" href="/">Back to home</a>
    <a class="lang" href="/ar/" hreflang="ar" lang="ar">العربية</a>
  </div>
  <div class="brand"><b>CAMR</b> STUDIO</div>
</body>
</html>
