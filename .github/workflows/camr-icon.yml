name: Build CAMR home screen icon
on:
  push:
    branches: [main]
    paths:
      - 'assets/images/camr-home-icon.svg'
      - '.github/workflows/camr-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate iPhone and favicon PNGs
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          source = 'assets/images/camr-home-icon.svg'
          for name, size in [('apple-touch-icon.png', 180), ('camr-home-icon-512.png', 512), ('camr-home-icon-192.png', 192)]:
              cairosvg.svg2png(url=source, write_to='assets/images/' + name, output_width=size, output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/apple-touch-icon.png assets/images/camr-home-icon-512.png assets/images/camr-home-icon-192.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate CAMR iPhone icon PNG assets"
            git push
          fi
